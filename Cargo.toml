[workspace]
resolver = "2"
members = [
    "crates/cercis-kit-core",
    "crates/plugin-project-wizard",
    "crates/plugin-data-entry",
    "crates/plugin-transfer",
    "crates/plugin-health",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
